  <circle cx="600" cy="520" r="420" fill="none" stroke="#1E2A4A" stroke-opacity="0.08" stroke-width="3" stroke-dasharray="10 14"/>
  <text x="600" y="92" text-anchor="middle" font-family="Avenir Next, Helvetica Neue, Arial" font-size="22" letter-spacing="6" fill="#1E2A4A" fill-opacity="0.55">EN SPRÅKMODELL BYGGD FRÅN NOLL</text>
  <!-- speech bubble with Swedish -->
  <g transform="translate(560 300)">
    <path d="M36 0h372a36 36 0 0 1 36 36v108a36 36 0 0 1-36 36H112l-66 58 16-58H36A36 36 0 0 1 0 144V36A36 36 0 0 1 36 0z" fill="#F2B632"/>
    <text x="222" y="78" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-style="italic" font-size="44" fill="#1E2A4A">Det var en gång</text>
    <text x="222" y="138" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-style="italic" font-size="44" fill="#1E2A4A">en liten älg…</text>
  </g>
  <!-- the little one -->
  <g transform="translate(300 420)">
    <rect x="0" y="0" width="220" height="220" rx="56" fill="#1E2A4A"/>
    <circle cx="72" cy="94" r="16" fill="#F6F1E7"/>
    <circle cx="148" cy="94" r="16" fill="#F6F1E7"/>
    <path d="M74 146q36 32 72 0" stroke="#F6F1E7" stroke-width="12" stroke-linecap="round" fill="none"/>
    <rect x="100" y="-38" width="20" height="42" rx="10" fill="#1E2A4A"/>
    <circle cx="110" cy="-46" r="18" fill="#F2B632"/>
  </g>
  <!-- wordmark -->
  <text x="600" y="900" text-anchor="middle" font-family="Avenir Next, Helvetica Neue, Arial" font-weight="700" font-size="240" letter-spacing="-6" fill="#1E2A4A">Pytte</text>
  <text x="600" y="1010" text-anchor="middle" font-family="Avenir Next, Helvetica Neue, Arial" font-size="36" fill="#1E2A4A" fill-opacity="0.8">1 miljon parametrar. Tränad på en laptop. Skriver svenska.</text>
  <text x="600" y="1110" text-anchor="middle" font-family="Avenir Next, Helvetica Neue, Arial" font-size="24" letter-spacing="4" fill="#1E2A4A" fill-opacity="0.45">ÖPPEN KOD · ÖPPEN DATA · ÖPPNA MODELLER</text>
</svg>
